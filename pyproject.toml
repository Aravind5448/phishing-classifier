[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing_classifier"
version = "0.1.0"
description = "Enterprise URL threat detection pipeline"
dependencies = [
    "pandas", "numpy", "scikit-learn", "xgboost",
    "streamlit", "tldextract", "joblib", "fastapi", 
    "uvicorn", "pydantic"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]